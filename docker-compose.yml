services:
  laundry-app:
    build: .
    container_name: laundry-app
    ports:
      - "3001:3000" # ← UBAH INI (dari 3000:3000 ke 3001:3000)
    environment:
      - NODE_ENV=production
      - DB_HOST=laundry-db
      - DB_PORT=3306
      - DB_USER=laundry_user
      - DB_PASSWORD=laundry_pass
      - DB_NAME=laundry_db
    depends_on:
      - laundry-db
    networks:
      - laundry-network
    restart: unless-stopped

  laundry-db:
    image: mysql:8.0
    container_name: laundry-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: laundry_db
      MYSQL_USER: laundry_user
      MYSQL_PASSWORD: laundry_pass
    volumes:
      - ./laundry_db.sql:/docker-entrypoint-initdb.d/init.sql
      - laundry-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - laundry-network
    restart: unless-stopped

networks:
  laundry-network:
    driver: bridge

volumes:
  laundry-data:
